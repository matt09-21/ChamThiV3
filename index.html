<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chấm thi trắc nghiệm THPT 2018</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- xlsx-js-style: SheetJS có hỗ trợ định dạng ô (in đậm, viền, gộp ô) cho file Excel kết quả. Dự phòng: SheetJS gốc. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>if(!window.XLSX)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#1b2a4e;--mute:#66728f;--line:#d3dbe8;--mark:#c8325a;--bad:#c8325a;--badbg:#fbe3ea;--ok:#1d7a4f;--okbg:#ddf3e8;--wn:#a15c00;--wnbg:#fdf0d8;--info:#2457c5;--infobg:#e3ebfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172b;--panel:#18213b;--ink:#e6ebf7;--mute:#93a0c2;--line:#2c3a5f;--mark:#ff6b8f;--bad:#ff6b8f;--badbg:#44202e;--ok:#5fd39b;--okbg:#173a2c;--wn:#ffc062;--wnbg:#3d2f17;--info:#8fb0ff;--infobg:#1d2a50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10172b;--panel:#18213b;--ink:#e6ebf7;--mute:#93a0c2;--line:#2c3a5f;--mark:#ff6b8f;--bad:#ff6b8f;--badbg:#44202e;--ok:#5fd39b;--okbg:#173a2c;--wn:#ffc062;--wnbg:#3d2f17;--info:#8fb0ff;--infobg:#1d2a50;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:25px;font-weight:800;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px;font:inherit;font-weight:500;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--mark);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}.panel h3{font-size:14px;margin:12px 0 6px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
label.ck{flex-direction:row;align-items:center;gap:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=number]{width:84px}input[type=range]{padding:0;width:160px}input[type=checkbox]{width:auto}
textarea{width:100%;min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.b{font:inherit;font-weight:700;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--ink);color:var(--bg)}
.b.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}.b.del{background:none;color:var(--bad);border:1px solid var(--line);font-weight:500}
.b.sm{padding:4px 9px;font-size:13px}
.b:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}.empty{color:var(--mute);text-align:center;padding:18px}
.warn{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.note{background:var(--infobg);color:var(--info);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.okm{background:var(--okbg);color:var(--ok);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:500}
td input,td select{padding:4px 6px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scr{display:flex;gap:12px;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap;align-items:flex-start}
.big{max-width:100%;width:620px;border-radius:6px;border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:24px;font-weight:800}.kpi span{font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px;white-space:nowrap}
.st-ok{background:var(--okbg);color:var(--ok)}.st-review{background:var(--wnbg);color:var(--wn)}.st-error{background:var(--badbg);color:var(--bad)}.st-info{background:var(--infobg);color:var(--info)}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.prog>i{display:block;height:100%;background:var(--mark);transition:width .2s}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.cvbox{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#9aa3b5;max-height:78vh}
.cvbox canvas{display:block;touch-action:none}
.props label{margin-bottom:6px}.props .row label{margin-bottom:0}
.props input[type=number]{width:74px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.qgrid label{flex-direction:row;align-items:center;gap:4px;font-size:12px}
.qgrid select,.qgrid input{padding:3px 4px;width:100%}
.bad-cell{outline:2px solid var(--wn);border-radius:4px}
.wrong{color:var(--bad);font-weight:700}.right{color:var(--ok);font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}
#video{width:100%;max-width:640px;border-radius:8px;background:#000;display:block}
.bars{display:flex;align-items:flex-end;gap:4px;height:180px;border-bottom:1px solid var(--line);padding-top:16px}
.bars div{flex:1;background:var(--mark);border-radius:4px 4px 0 0;position:relative;min-width:12px}
.bars div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.bl{display:flex;gap:4px;font-size:11px;color:var(--mute)}.bl span{flex:1;text-align:center;min-width:12px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.modes .b{border-radius:0;border:0}
.dirty{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--wn);margin-right:4px}
.edsplit{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:980px){.edsplit{grid-template-columns:1fr}}
.edtwo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edtwo .cap{font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
.edprm .sec{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.edprm label{margin-bottom:4px}.edprm input[type=range]{width:100%}
.edprm .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.ord{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}.ord span{flex:1}
.chg{background:var(--wnbg)}
#edmini,#dmini{display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.busyov{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:13px;font-weight:700}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stp{display:flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:500;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-weight:700;font-size:12px}
.stp.ok i{background:var(--okbg);color:var(--ok)}.stp.on{color:var(--ink);font-weight:700;border-color:var(--ink)}.stp.on i{background:var(--ink);color:var(--bg)}
.tbar{position:sticky;top:0;z-index:3;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
details.panel>summary{list-style:revert}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;color:#000;background:#fff;font:12px/1.4 "Be Vietnam Pro",Arial,sans-serif}
 #printArea.sheet img{width:100%;display:block}
 #printArea table{border-collapse:collapse;width:100%}#printArea th,#printArea td{border:1px solid #000;padding:3px 5px;color:#000}
 #printArea h2{font-size:15px;margin:10px 0 4px}#printArea .pb{page-break-before:always}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Chấm thi trắc nghiệm THPT (Chương trình GDPT 2018)</h1>
<p class="sub" id="sub">Phiếu gồm số báo danh, mã đề, Phần I nhiều lựa chọn, Phần II đúng sai, Phần III trả lời ngắn.</p>
<nav role="tablist">
<button role="tab" data-t="dash">Tổng quan</button><button role="tab" data-t="exams">Kỳ thi</button><button role="tab" data-t="keys">Đề thi &amp; đáp án</button><button role="tab" data-t="cands">Thí sinh</button><button role="tab" data-t="tpl">Mẫu phiếu &amp; lưới</button><button role="tab" data-t="scan">Quét OMR</button><button role="tab" data-t="review">Chấm thi (duyệt)</button><button role="tab" data-t="res">Kết quả</button><button role="tab" data-t="rep">Báo cáo</button><button role="tab" data-t="set">Cài đặt</button>
</nav>
<div id="app"><div class="panel empty">Đang tải dữ liệu…</div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<script>
'use strict';
/* ====================== TIỆN ÍCH ====================== */
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function r2(x){return Math.round(x*100)/100}
function arr(n,f){var a=[];for(var i=0;i<n;i++)a.push(f(i));return a}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function vn(x){return x==null||x===''||isNaN(x)?'–':String(r2(x)).replace('.',',')}
function pad(n){return(n<10?'0':'')+n}
function nowStr(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function clone(o){return JSON.parse(JSON.stringify(o))}
var TT=null;function toast(m,bad){var t=$('toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(TT);TT=setTimeout(function(){t.className=''},bad?5000:2600)}
function ask(m){try{return window.confirm(m)}catch(e){return true}}
function tick(){return new Promise(function(r){setTimeout(r,16)})}

/* ====================== LƯU TRỮ: IndexedDB (dữ liệu có cấu trúc + ảnh) + localStorage (thiết lập nhỏ) ====================== */
var IDB=null,IMG={};
function idbOpen(){return new Promise(function(ok){try{var q=indexedDB.open('cham-tn-2018',1);q.onupgradeneeded=function(){var d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('img'))d.createObjectStore('img')};q.onsuccess=function(){IDB=q.result;ok(IDB)};q.onerror=function(){ok(null)}}catch(e){ok(null)}})}
function idbReq(st,mode,fn){return new Promise(function(ok){if(!IDB)return ok(undefined);try{var tx=IDB.transaction(st,mode),q=fn(tx.objectStore(st));tx.oncomplete=function(){ok(q&&q.result)};tx.onerror=tx.onabort=function(){ok(undefined)}}catch(e){ok(undefined)}})}
function idbGet(st,k){return idbReq(st,'readonly',function(s){return s.get(k)})}
function idbPut(st,k,v){return idbReq(st,'readwrite',function(s){return s.put(v,k)})}
function idbDel(st,k){return idbReq(st,'readwrite',function(s){return s.delete(k)})}
function idbKeys(st){return idbReq(st,'readonly',function(s){return s.getAllKeys()})}
function idbClear(st){return idbReq(st,'readwrite',function(s){return s.clear()})}
function setImg(id,url){IMG[id]=url;idbPut('img',id,url)}
function getImg(id,cb){if(IMG[id]!==undefined)return IMG[id];IMG[id]=null;idbGet('img',id).then(function(u){IMG[id]=u||'';if(u&&cb)cb()});return null}
function delImg(id){delete IMG[id];idbDel('img',id)}
/* Ảnh của một bài thi: ảnh dùng nhận diện (r.id), ảnh gốc (r.id+':o'), các phiên bản chỉnh sửa (r.imgv) */
async function imgUrl(id){if(IMG[id])return IMG[id];var u=await idbGet('img',id);if(u)IMG[id]=u;return u||''}
function delResImgs(r){delImg(r.id);delImg(r.id+':o');((r.imgv&&r.imgv.list)||[]).forEach(function(v){Object.keys(v.keys||{}).forEach(function(k){if(v.keys[k])delImg(v.keys[k])})})}

var DEF_SET={omrV2:1,sens:0.45,multi:0.65,faint:0.3,align:true,sv:0.6,method:'density',engine:'js',minAcc:0.98,unitL:'BỘ GIÁO DỤC VÀ ĐÀO TẠO',unitL2:'',unitR:'CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM',unitR2:'Độc lập - Tự do - Hạnh phúc',sign1:'Cán bộ chấm thi',sign2:'Lãnh đạo',theme:''};
var DB={ver:2,exams:[],templates:[],drafts:{},cur:'',set:clone(DEF_SET)};
var UI={tab:'dash',busy:'',prog:0,rv:-1,rvFilter:'need',resFilter:'all',resQ:'',tplSel:null,tplZoom:3,showGrid:true,cal:null,calKey:'',keyPrev:null,candPrev:null,stExam:'',lastScan:[]};
var SVT=null,SAVING=false;
function save(){clearTimeout(SVT);SVT=setTimeout(saveNow,250)}
function saveNow(){clearTimeout(SVT);var data=clone(DB);if(IDB){idbPut('kv','db',data)}else{try{localStorage.setItem('cham-tn-2018',JSON.stringify(data))}catch(e){toast('Không lưu được dữ liệu (bộ nhớ trình duyệt đầy).',1)}}
 try{localStorage.setItem('cham-tn-2018-ui',JSON.stringify({tab:UI.tab}))}catch(e){}}
async function load(){await idbOpen();var d=IDB?await idbGet('kv','db'):null;
 if(!d){try{d=JSON.parse(localStorage.getItem('cham-tn-2018')||'null')}catch(e){}}
 if(d&&d.exams){DB=d;DB.set=Object.assign(clone(DEF_SET),d.set||{})}
 else migrateOld();
 try{var u=JSON.parse(localStorage.getItem('cham-tn-2018-ui')||'null');if(u&&u.tab)UI.tab=u.tab}catch(e){}
 DB.exams.forEach(fitExam);
 if(!DB.exams.length){var e=newExam({name:'Kỳ thi mẫu',subject:'toan'});DB.cur=e.id}
 if(!curEx())DB.cur=DB.exams[0].id;
 DB.templates.forEach(function(t){t.landmarks=t.landmarks||[];t.align=t.align||'anchor';t.blocks.forEach(function(b){if(!b.name)b.name=BT[b.type]})});
 if(!DB.set.omrV2){DB.set.omrV2=1;if(DB.set.faint<0.3)DB.set.faint=0.3}/* thang mức tô mới đã chuẩn hóa theo phiếu: ô trống ≈ 0,05, ô tô ≈ 0,9 */
 DB.drafts=DB.drafts||{};Object.keys(DB.drafts).forEach(function(k){var t=DB.drafts[k];if(!tplById(k)||!t||!t.blocks){delete DB.drafts[k];return}t.landmarks=t.landmarks||[];t.align=t.align||'anchor'});
 if(DB.set.engine==='opencv')loadCV().catch(function(e){toast('OpenCV.js: '+e.message+' – dùng bộ xử lý JavaScript.',1)});
 applyTheme();saveNow()}
/* Chuyển dữ liệu từ phiên bản cũ (localStorage 'cham2025') sang kỳ thi mới — không làm mất dữ liệu cũ */
function migrateOld(){var o=null;try{o=JSON.parse(localStorage.getItem('cham2025')||'null')}catch(e){}
 if(!o||!o.cfg)return;var c=o.cfg,e=newExam({name:'Kỳ thi chuyển từ phiên bản cũ',subject:'custom',p1:c.p1,p2:c.p2,p3:c.p3,pt1:c.pt1,pt3:c.pt3,sbdLen:8,mdLen:3});
 Object.keys(o.keys||{}).forEach(function(m){var k=o.keys[m];e.keys[m]={p1:k.p1||[],p2:k.p2||[],p3:k.p3||[]}});e.curKey=Object.keys(e.keys)[0]||'';
 e.cands=(o.cands||[]).map(function(x){return{sbd:String(x.sbd),name:x.name||'',dob:'',cls:x.cls||''}});
 e.res=(o.res||[]).map(function(r){return{id:r.id||uid(),ts:Date.now(),src:r.name||'',sbd:r.sbd||'',made:r.made||'',p1:r.p1||[],p2:r.p2||[],p3:r.p3||[],flags:[],warn:r.warn?[r.warn]:[],status:r.warn?'review':'ok',viol:0,edited:true}});
 fitExam(e);DB.cur=e.id;addLog(e,'Đã chuyển dữ liệu từ phiên bản cũ ('+e.res.length+' bài).')}
function applyTheme(){var t=DB.set.theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}

/* ====================== MÔ HÌNH KỲ THI ====================== */
var SUBJ={toan:{n:'Toán',p1:12,p2:4,p3:6,pt1:0.25,pt3:0.5},ly:{n:'Vật lí',p1:18,p2:4,p3:6,pt1:0.25,pt3:0.25},hoa:{n:'Hóa học',p1:18,p2:4,p3:6,pt1:0.25,pt3:0.25},sinh:{n:'Sinh học',p1:18,p2:4,p3:6,pt1:0.25,pt3:0.25},
 su:{n:'Lịch sử',p1:24,p2:4,p3:0,pt1:0.25,pt3:0.25},dia:{n:'Địa lí',p1:18,p2:4,p3:6,pt1:0.25,pt3:0.25},ktpl:{n:'Giáo dục Kinh tế và Pháp luật',p1:24,p2:4,p3:0,pt1:0.25,pt3:0.25},
 anh:{n:'Tiếng Anh',p1:40,p2:0,p3:0,pt1:0.25,pt3:0.25},custom:{n:'Tùy chỉnh',p1:20,p2:0,p3:0,pt1:0.5,pt3:0.25}};
var P2SCALE=[0.1,0.25,0.5,1];
function curEx(){return DB.exams.find(function(e){return e.id===DB.cur})}
function exById(id){return DB.exams.find(function(e){return e.id===id})}
function tplById(id){return DB.templates.find(function(t){return t.id===id})}
function tplOf(ex){return ex&&tplById(ex.tplId)}
function addLog(ex,m){ex.log=ex.log||[];ex.log.unshift({ts:Date.now(),m:m});if(ex.log.length>400)ex.log.length=400}
function newExam(o){var s=SUBJ[o.subject]||SUBJ.custom,p1=o.p1!=null?+o.p1:s.p1,p2=o.p2!=null?+o.p2:s.p2,p3=o.p3!=null?+o.p3:s.p3;
 var e={id:uid(),name:o.name||('Kỳ thi '+s.n),subject:o.subject||'custom',subjName:o.subjName||s.n,date:o.date||new Date().toISOString().slice(0,10),dur:o.dur||(o.subject==='toan'?90:o.subject==='anh'?60:50),cls:o.cls||'',
  sbdLen:o.sbdLen||6,mdLen:o.mdLen||3,st:{p1:p1,p2:p2,p2k:4,p3:p3},pts:{p1:arr(p1,function(){return o.pt1!=null?+o.pt1:s.pt1}),p2:arr(p2,function(){return P2SCALE.slice()}),p3:arr(p3,function(){return o.pt3!=null?+o.pt3:s.pt3})},
  keys:{},curKey:'',cands:[],res:[],log:[],created:Date.now()};
 var dt=DB.templates.find(function(x){return x.subject&&x.subject===e.subject&&x.subjDefault});
 if(dt){e.tplId=dt.id}else{var t=autoTemplate(e);t.name='Mẫu phiếu – '+e.name;DB.templates.push(t);e.tplId=t.id}

/* ====================== ITS3 §13 – HÌNH HỌC LIÊN KẾT ĐIỂM NEO ↔ VÙNG NHẬN DIỆN ======================
   Quy ước chiều biến đổi (không dùng lẫn một ma trận cho hai chiều):
   • H_t2i = homog(neo của mẫu [mm], neo trên ảnh [px])   : phiếu chuẩn → ảnh gốc.
       - Chiếu vùng/ô nhận diện lên ảnh gốc:  p_ảnh = H_t2i(p_mm)
       - Nắn ảnh (warpPerspective, lấy mẫu ngược): pixel chuẩn (u,v) → mm → H_t2i → pixel ảnh gốc
   • H_i2t = invH(H_t2i)                                    : ảnh gốc → phiếu chuẩn (đổi vị trí chuột trên ảnh gốc sang mm).
   • T_a   = homog(neo mẫu CŨ [mm], neo mẫu MỚI [mm])       : phiếu chuẩn → phiếu chuẩn, dùng ở Chế độ A khi dời điểm neo của MẪU.
       Mọi tâm ô p được biến thành T_a(p) (lưu = lưới công thức + phần bù từng ô), nên với cùng 4 góc trên ảnh:
       H_t2i_mới(T_a(p)) = H_t2i_cũ(p) → các vùng giữ nguyên vị trí thực trên tờ phiếu.
   Mọi vùng chỉ lưu trong MỘT hệ tọa độ: mm trên khổ giấy của mẫu (xuất JSON chuẩn hóa 0–1). Giao diện, cấu hình và thuật toán OMR dùng chung hệ này. */
function invH(h){var m=m3inv(h.concat([1]));return m.slice(0,8).map(function(v){return v/m[8]})}
function quadArea(Q){var a=0;for(var i=0;i<4;i++){var p=Q[i],q=Q[(i+1)%4];a+=p[0]*q[1]-q[0]*p[1]}return a/2}

 var mn=Math.max(3,Math.min(W||1e9,H||1e9)*0.02);for(i=0;i<4;i++)for(j=i+1;j<4;j++)if(dist(Q[i],Q[j])<mn)return'Điểm neo P'+(i+1)+' và P'+(j+1)+' trùng hoặc quá gần nhau.';
 for(i=0;i<4;i++){var a=Q[i],b=Q[(i+1)%4],c=Q[(i+2)%4],z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(z<=0)return'Tứ giác điểm neo bị lõm, xoắn hoặc sai thứ tự (P1 trên trái → P2 trên phải → P3 dưới phải → P4 dưới trái).'}

/* ---------- Thông số (thanh trượt: xem trước trực tiếp, có độ trễ để không giật) ---------- */
function edSetPath(P,path,v){var a=path.split('.');if(a.length===1)P[a[0]]=v;else P[a[0]][a[1]]=v}
function edVal(t){return t.type==='checkbox'?t.checked:t.type==='range'||t.type==='number'?parseFloat(t.value):t.value}
/* Bộ lọc nặng (khử mờ, NLM) chỉ chạy khi bấm "Xem trước" để thao tác kéo thanh trượt không bị giật */
function edHeavy(){var P=ED.P;return edStepOn('db')||(edStepOn('dn')&&P.dn.m==='nlm')}
function edParamChanged(ms){if(edHeavy()){clearTimeout(ED.timer);ED.stale=true;edStatus();return}edSchedule(ms)}
app.addEventListener('input',function(e){var t=e.target;if(!ED||UI.tab!=='review')return;if(t.dataset.ep){edSetPath(ED.P,t.dataset.ep,edVal(t));var lb=$('ev_'+t.dataset.ep.replace('.','_'));if(lb)lb.textContent=t.value;edParamChanged();return}if(t.id==='edswipe'){ED.swipe=+t.value;edDraw()}});
app.addEventListener('change',function(e){var t=e.target;if(!ED||UI.tab!=='review')return;
 if(t.dataset.ep){edSetPath(ED.P,t.dataset.ep,edVal(t));edCommit();if(t.tagName==='SELECT'||t.type==='checkbox'){var p=$('edprm');if(p)p.innerHTML=edPrmHTML()}edParamChanged(t.type==='range'?350:30);return}
 if(t.id==='edview'){ED.view=t.value;render();return}if(t.id==='edov'){ED.ov=t.checked;edDraw();return}if(t.id==='edshowall'){ED.showAll=t.checked;var rr=$('edrr');if(rr)rr.innerHTML=edRerunHTML();return}});
/* ---------- Lưu phiên bản / khôi phục / chạy lại nhận diện ---------- */

 var ex=exById(ED.exid),r=edRes(),t=edTpl();await edEnsureV0(r);var n=r.imgv.list.length,b=r.id+':v'+n;
 setImg(b+'w',wpToDataURL(ED.Wp0,0.9));if(ED.deb)setImg(b+'d',wpToDataURL(ED.deb,0.9));setImg(b+'f',wpToDataURL(ED.Wp,0.92));
 r.imgv.list.push({n:n,at:Date.now(),kind:'edit',srcKind:ED.srcKind,rot:ED.rot,corners:ED.corners.map(function(p){return[+(p[0]/ED.G.W).toFixed(6),+(p[1]/ED.G.H).toFixed(6)]}),cornersPx:ED.corners.map(function(p){return[r2(p[0]),r2(p[1])]}),imgSize:[ED.G.W,ED.G.H],anchorMode:ED.found||'manual',params:clone(ED.P),order:ED.order.slice(),keys:{warp:b+'w',deblur:ED.deb?b+'d':null,final:b+'f'},metrics:{before:edMShort(ED.mBefore),after:edMShort(ED.mAfter)},tplId:t.id});
 ED.curV=n;addLog(ex,'Lưu phiên bản ảnh chỉnh sửa v'+n+' cho bài '+(r.sbd||r.src)+' ('+edParamSum(ED.P,ED.order)+').');save();if(!silent){render();toast('Đã lưu phiên bản ảnh v'+n+'. Ảnh gốc vẫn được giữ nguyên.')}return n}
async function edLoadVersion(n){var r=edRes(),t=edTpl(),v=r&&r.imgv&&r.imgv.list[n];if(!v)return;if(n===0&&v.isOrig){ACT.edResetAll();return}
 var uf=await imgUrl(v.keys.final),uw=v.keys.warp?await imgUrl(v.keys.warp):uf;if(!uf){toast('Ảnh của phiên bản này không còn trong bộ nhớ (khôi phục từ bản sao lưu không kèm ảnh?).',1);return}
 var gen=++ED.gen;clearTimeout(ED.timer);var ld=async function(u){var im=await loadImg(u),G=toGray(im,99999);G.ppm=G.W/t.w;return G},W0=await ld(uw),W1=uw===uf?W0:await ld(uf);if(!ED||gen!==ED.gen)return;
 ED.Wp0=W0;ED.Wp=W1;ED.deb=null;ED.cvBefore=grayToCanvas(W0);ED.cvAfter=grayToCanvas(W1);ED.mBefore=imgMetrics(W0);ED.mAfter=imgMetrics(W1);ED.R0=readWarp(W0,t,DB.set);ED.R=readWarp(W1,t,DB.set);ED.abad=anchorBad(W0,t);ED.qerr='';

 ED.curV=n;ED.cand=null;ED.view='after';ED.autoMsg=n===0?'Đã mở ảnh lúc quét (phiên bản v0 – ảnh gốc chưa chỉnh sửa).':'Đã mở phiên bản v'+n+'.';ED.lastSnap=edSnap();render();toast((n===0?'Đã khôi phục ảnh gốc':'Đã mở phiên bản v'+n)+'. Bấm "Chạy lại nhận diện" rồi xác nhận để dùng cho bài thi.')}
Object.assign(ACT,{
 edOpen:function(a){edOpen(a)},
 edRestoreOrig:async function(a){await edOpen(a,'after');if(ED&&ED.rid===a)await edLoadVersion(0)},
 edCancel:function(){if(!ED)return;var dirty=ED.H.u.length&&ED.curV==null;if(dirty&&!ask('Đóng trình chỉnh sửa? Các chỉnh sửa chưa "Áp dụng" sẽ bị hủy (ảnh gốc và kết quả bài thi không thay đổi).'))return;var rid=ED.rid;clearTimeout(ED.timer);ED=null;UI.rv=rid;render()},

 edWarpBtn:function(){if(edWarp()){edCommit();render();toast('Đã hiệu chỉnh phối cảnh theo 4 điểm neo.')}else toast(ED.qerr||'Chưa có 4 điểm neo hợp lệ.',1)},
 edUndo:function(){if(!ED.H.u.length){toast('Không còn thao tác để hoàn tác.');return}ED.H.r.push(edSnap());edRestoreSnap(ED.H.u.pop())},

 edZoom:function(a){if(a==='fit'){ED.zs=0;ED.zt=0}else{var f=a==='1'?1.25:0.8;if(ED.view==='edit')ED.zs=Math.max(0.1,Math.min(6,(ED.zs||1)*f));else ED.zt=Math.max(1,Math.min(14,(ED.zt||3)*f))}edDraw()},

 edCommitRes:async function(){var ex=exById(ED.exid),r=edRes(),t=edTpl(),c=ED.cand;if(!c||!r)return;if(!ask('Cập nhật đáp án nhận diện của bài '+(r.sbd||r.src)+' theo ảnh đã chỉnh sửa?\nBài sẽ chuyển về "Cần kiểm tra"; điểm chỉ được chốt khi bạn bấm "Lưu & chốt điểm".'))return;
